<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peeking Phone AU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:#0e0e10;display:flex;align-items:center;justify-content:center;font-family:Inter,-apple-system,"SF Pro Display",system-ui,sans-serif;color:#fff}
.phone{position:relative;flex:none;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;box-shadow:0 0 0 10px #17171a,0 0 0 12px #3a3a3f,0 40px 90px #000a;transform-origin:center}
@media(max-width:480px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}}

/* wallpaper */
.wall{position:absolute;inset:0;background:radial-gradient(120% 70% at 10% 0%,#1d3a8a 0%,transparent 60%),linear-gradient(170deg,#2b2f86 0%,#4b3fa8 45%,#1a1f5c 100%);overflow:hidden}
.wall.photo::before,.wall.photo::after{display:none}
.ico img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
.wall::before{content:"";position:absolute;left:-30%;top:-8%;width:95%;height:78%;border-radius:50% 55% 60% 45%/45% 60% 50% 55%;background:linear-gradient(160deg,#a99df0,#7a5fe0 45%,#5a46b8);transform:rotate(-14deg)}
.wall::after{content:"";position:absolute;right:-45%;top:34%;width:100%;height:80%;border-radius:55% 45% 40% 60%;background:linear-gradient(200deg,#6fb4ee,#3f6fc4 55%,#2a3c96)}

/* status bar + island */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:100}
.status{position:absolute;top:0;left:0;right:0;height:54px;padding:19px 34px 0;display:flex;justify-content:space-between;font-size:16px;font-weight:600;z-index:90;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#fff;z-index:100;cursor:pointer}
.homebar::after{content:"";position:absolute;inset:-16px -12px}
.layer{position:absolute;inset:0}

/* lock screen */
.lock{text-align:center}
.lock .date{margin-top:92px;font-size:21px;font-weight:600;opacity:.92}
.lock .time{font-size:112px;font-weight:600;letter-spacing:-3px;line-height:1;margin-top:-2px;opacity:.9}
.pill{display:inline-flex;gap:6px;align-items:center;margin-top:14px;padding:7px 14px;border-radius:20px;background:#ffffff26;font-size:14px;font-weight:600;backdrop-filter:blur(10px)}
.lnotifs{position:absolute;left:12px;right:12px;bottom:128px;display:flex;flex-direction:column;gap:8px}
.notif{display:flex;gap:11px;align-items:center;text-align:left;padding:12px 14px;border-radius:26px;background:#1c2236b8;border:1px solid #ffffff38;backdrop-filter:blur(22px);cursor:pointer;color:#fff;width:100%;font:inherit;animation:drop .5s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{transform:translateY(-14px) scale(.96);opacity:0}}
.av{position:relative;width:40px;height:40px;border-radius:50%;background:#59627a;display:grid;place-items:center;font-weight:600;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av .mini{position:absolute;right:-6px;bottom:-5px;width:20px;height:20px;border-radius:6px;display:grid;place-items:center}
.mini svg{width:100%;height:100%}
.notif .t{flex:1;min-width:0}
.notif .row{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.notif .row span{font-weight:400;font-size:13px;opacity:.6}
.notif p{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{position:absolute;bottom:52px;width:52px;height:52px;border-radius:50%;background:#1c2236a0;border:1px solid #ffffff38;display:grid;place-items:center;backdrop-filter:blur(14px)}
.swipe{position:absolute;bottom:62px;left:0;right:0;font-size:15px;font-weight:600;opacity:.75;cursor:pointer}

/* passcode */
.pass{background:#0d1030aa;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);text-align:center;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.pass h2{margin-top:96px;font-size:21px;font-weight:600}
.pass .hint{margin-top:10px;font-size:15px;opacity:.7;min-height:20px}
.dots{display:flex;gap:22px;justify-content:center;margin:26px 0 38px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}
.dots i.on{background:#fff}
.dots.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.keys{display:grid;grid-template-columns:repeat(3,80px);gap:16px 26px;justify-content:center}
.keys button{height:80px;border-radius:50%;border:1px solid #ffffff2e;background:#ffffff1c;color:#fff;font:inherit;font-size:36px;font-weight:300;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:background .12s;backdrop-filter:blur(8px)}
.keys button:active{background:#ffffff55}
.keys small{font-size:10px;font-weight:700;letter-spacing:2px;height:10px}
.keys .z{grid-column:2}
.pfoot{position:absolute;bottom:42px;left:0;right:0;display:flex;justify-content:space-between;padding:0 44px;font-size:17px;font-weight:500}
.pfoot button{background:none;border:0;color:#fff;font:inherit;cursor:pointer}

/* home */
.widgets{display:flex;gap:14px;padding:64px 22px 0}
.wg{flex:1;height:170px;border-radius:26px;padding:16px;backdrop-filter:blur(16px);position:relative}
.wg.cal{background:#1a1c24d9}
.wg.cal b{display:block;color:#ff453a;font-size:15px;font-weight:600}
.wg.cal span{font-size:62px;font-weight:300;line-height:1.05}
.wg.wx{background:linear-gradient(160deg,#6f87b9cc,#6a7fb4a6)}
.wg.wx .c{font-size:15px;font-weight:600}
.wg.wx .tp{font-size:46px;font-weight:300;margin-top:2px}
.wg.wx .d{position:absolute;left:16px;bottom:14px;font-size:14px;font-weight:600;line-height:1.35}
.wg.wx .d small{display:block;font-size:12.5px;font-weight:500}
.wg.wx svg{position:absolute;right:14px;top:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:19px;padding:24px 14px 0}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.ico{position:relative;width:62px;height:62px;border-radius:15px;display:grid;place-items:center;overflow:visible;box-shadow:0 3px 8px #0003;transition:transform .1s}
.app:active .ico{transform:scale(.9)}
.ico>svg{width:100%;height:100%;border-radius:15px}
.ico .in{position:absolute;inset:0;border-radius:15px;overflow:hidden;display:grid;place-items:center}
.badge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#ff3b30;font-size:14px;font-weight:600;display:grid;place-items:center;z-index:2;box-shadow:0 1px 3px #0005}
.search{position:absolute;bottom:132px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 20px;border-radius:20px;background:#00000040;font-size:14px;font-weight:500;backdrop-filter:blur(10px)}
.dock{position:absolute;bottom:26px;left:12px;right:12px;height:94px;border-radius:34px;background:#ffffff2a;backdrop-filter:blur(26px);display:flex;justify-content:space-around;align-items:center;padding:0 6px}
.app em{font-style:normal}.dock .app em{display:none}

/* app placeholder */
.appscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;animation:openApp .28s cubic-bezier(.2,.8,.3,1);z-index:50;padding:0 40px}
@keyframes openApp{from{transform:scale(.55);opacity:0;border-radius:40px}}
.appscreen h1{font-size:30px;font-weight:700}
.appscreen p{opacity:.65;font-size:15px;line-height:1.4}
.appscreen .ico{width:110px;height:110px;border-radius:26px}
.appscreen .ico>svg{border-radius:26px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="island"></div>
  <div class="status"><span id="clk"></span><span class="r" id="sig"></span></div>
  <div id="screen"></div>
  <div class="homebar" id="homebar"></div>
</div>

<script>
/* =========================================================
   1. PENGATURAN & CERITAMU — ubah bagian ini saja
   ========================================================= */
const STORY = {
  phone: {
    owner: "Alif",
    pin: "2003",                       // kode passcode
    hint: "alif's birthday",           // tulisan kecil di bawah "Enter Passcode" (kosongkan "" kalau tak mau)
    time: "13:20",                     // jam di HP. Tulis "auto" supaya ikut jam asli
    weekday: "Saturday", month: "October", day: 31,
    lang: "English",                   // tombol kecil di lock screen. Kosongkan "" untuk menyembunyikan
    battery: 80,                       // persen baterai (0-100)
    signal: 4,                         // kekuatan sinyal, 0 sampai 4 batang
    wifi: true,                        // true = ikon wifi tampil, false = hilang
  },

  // Wallpaper. Isi alamat gambar (misal "img/lock.jpg"). Kosongkan "" untuk wallpaper bawaan.
  wallpaper: { lock: "", home: "" },

  // Ganti ikon aplikasi dengan gambarmu sendiri, per aplikasi. Contoh:
  // iconImages: { wa: "img/wa.png", x: "img/x.png" }
  iconImages: {},

  weather: { city: "Yogyakarta", temp: 26, desc: "Hujan ringan", high: 29, low: 22 },

  // Notifikasi yang tampil di layar kunci.
  // photo: isi alamat gambar ("img/apin.jpg") kalau punya foto. Kalau kosong, pakai huruf 'initial'.
  lockNotifs: [
    { app: "wa", name: "Apin 😝", text: "min", time: "now", initial: "A", photo: "" },
  ],

  // Angka merah di pojok ikon
  badges: { mail: 1, wa: 3 },

  // Daftar aplikasi (id dipakai di 'home' dan 'dock'). Nama boleh diganti.
  apps: {
    mail: "Mail", photos: "Photos", weather: "Weather", calendar: "Calendar",
    notes: "Notes", maps: "Maps", x: "X", settings: "Settings",
    camera: "Camera", clock: "Clock", facebook: "Facebook", instagram: "Instagram",
    phone: "Phone", safari: "Safari", wa: "WhatsApp", spotify: "Spotify",
  },
  home: ["mail","photos","weather","calendar","notes","maps","x","settings","camera","clock","facebook","instagram"],
  dock: ["phone","safari","wa","spotify"],
};

/* =========================================================
   2. MESIN — bagian di bawah ini tidak perlu disentuh
   ========================================================= */
const $ = (s, e = document) => e.querySelector(s);
const screenEl = $("#screen");
const S = { mode: "lock", pin: "", pending: null };
const P = STORY.phone;

// ---------- Ikon aplikasi (digambar dengan SVG, tanpa file gambar) ----------
const petals = [...Array(8)].map((_, i) => `<ellipse cx="30" cy="19" rx="5.5" ry="10" fill="#fff" fill-opacity=".85" transform="rotate(${i * 45} 30 30)"/>`).join("");
const hand = `<path d="M21 14c-2 0-4 2-4 5 0 9 11 22 22 22 3 0 5-2 5-4l-5-4-3 2.5c-4-1.5-8-6-9.5-10l2.5-3z" fill="#fff"/>`;
const ICONS = {
  mail:      ["linear-gradient(#4aa8ff,#1c63ee)", `<rect x="11" y="17" width="38" height="27" rx="4.5" fill="#fff"/><path d="M12 20l18 14 18-14" fill="none" stroke="#2a7cf6" stroke-width="2.6"/>`],
  photos:    ["linear-gradient(#e6f4ff,#a8d4ff)", petals + `<circle cx="30" cy="30" r="6" fill="#ffc933"/>`],
  weather:   ["linear-gradient(#58adff,#2a6ee0)", `<circle cx="24" cy="23" r="9.5" fill="#ffd23f"/><path d="M19 44a8.5 8.5 0 0 1 2-16.5 12 12 0 0 1 23 3.5 7.5 7.5 0 0 1-1 13z" fill="#fff"/>`],
  calendar:  ["#fff", ""],
  notes:     ["#fff", `<rect width="60" height="15" fill="#ffd60a"/><path d="M9 28h42M9 37h42M9 46h42" stroke="#dcdce1" stroke-width="2"/>`],
  maps:      ["#e9f2df", `<path d="M-4 52L30 8l36 14" stroke="#fff" stroke-width="8" fill="none"/><path d="M6 64L24 -4" stroke="#ffd45c" stroke-width="7"/><path d="M40 17c-6.500 0-10 4.500-10 9.500C30 35 40 44 40 44s10-9 10-17.500c0-5-3.500-9.500-10-9.500z" fill="#ff3b30"/><circle cx="40" cy="26.500" r="3.800" fill="#fff"/>`],
  x:         ["#000", `<path d="M17 15L43 45M43 15L17 45" stroke="#fff" stroke-width="4.200" stroke-linecap="round"/>`],
  settings:  ["linear-gradient(#a9a9ae,#6e6e73)", `<circle cx="30" cy="30" r="15.500" fill="none" stroke="#ececf0" stroke-width="7.500" stroke-dasharray="6.080 6.080"/><circle cx="30" cy="30" r="11" fill="#ececf0"/><circle cx="30" cy="30" r="5" fill="#85858b"/>`],
  camera:    ["linear-gradient(#dcdce0,#a9a9ae)", `<rect x="9" y="19" width="42" height="27" rx="6" fill="#3b3b40"/><rect x="37" y="15" width="9" height="6" rx="2" fill="#3b3b40"/><circle cx="30" cy="32.500" r="9.500" fill="#9bb3c9" stroke="#1c1c1e" stroke-width="3"/>`],
  clock:     ["#000", `<circle cx="30" cy="30" r="23" fill="#fff"/><path d="M30 30V14M30 30l10 6" stroke="#111" stroke-width="3.200" stroke-linecap="round"/><path d="M30 30l-7 11" stroke="#ff9f0a" stroke-width="1.600"/>`],
  facebook:  ["linear-gradient(#2a8bff,#1665e8)", `<path d="M33.500 51V34h6l1-7h-7v-4c0-2 1-3 3.200-3h4V14h-6c-6.500 0-9 4-9 8.500V27h-6v7h6v17z" fill="#fff"/>`],
  instagram: ["radial-gradient(circle at 30% 105%,#fdf497 0%,#fd5949 42%,#d6249f 62%,#285aeb 92%)", `<rect x="14" y="14" width="32" height="32" rx="10" fill="none" stroke="#fff" stroke-width="3.500"/><circle cx="30" cy="30" r="7.500" fill="none" stroke="#fff" stroke-width="3.500"/><circle cx="40" cy="20" r="2.200" fill="#fff"/>`],
  phone:     ["linear-gradient(#62e676,#1fb23c)", hand],
  safari:    ["#fff", `<circle cx="30" cy="30" r="22" fill="#2d8cff"/><path d="M40 20L34 34 20 40 26 26z" fill="#fff"/><path d="M40 20L34 34 26 26z" fill="#ff3b30"/>`],
  wa:        ["linear-gradient(#60f07c,#1fbc45)", `<path d="M30 13a17 17 0 0 0-14.500 25.700L13 47l8.600-2.300A17 17 0 1 0 30 13z" fill="none" stroke="#fff" stroke-width="3.600" stroke-linejoin="round"/><path d="M24 23c-1.200 0-2.200 1.500-1.700 3.500 1.500 5 6 8.500 10 9.500 2 .5 3.600-1 3.600-2l-3-2-1.500 1.200c-2-.8-4-2.800-4.800-4.800l1.300-1.500z" fill="#fff"/>`],
  spotify:   ["#191414", `<circle cx="30" cy="30" r="19.500" fill="#1ed760"/><path d="M19.500 25c7.500-2.200 16-1.200 22 3M21 32c6-1.600 12-1 17.500 2M22.500 38.500c5-1 9.500-.7 13.500 1.600" stroke="#191414" stroke-width="3.200" fill="none" stroke-linecap="round"/>`],
};
function icon(id) {
  const img = STORY.iconImages && STORY.iconImages[id];
  if (img) return `<span class="ico" style="background:#222"><img src="${img}" alt=""></span>`;
  const [bg, svg] = ICONS[id] || ["#555", ""];
  const inner = id === "calendar"
    ? `<div class="in" style="flex-direction:column;color:#111"><small style="color:#ff3b30;font-size:9.500px;font-weight:600;margin-top:5px">${P.weekday}</small><b style="font-size:33px;font-weight:300;line-height:1">${P.day}</b></div>`
    : `<svg viewBox="0 0 60 60">${svg}</svg>`;
  return `<span class="ico" style="background:${bg}">${inner}</span>`;
}

// ---------- Hal kecil: jam, sinyal, baterai ----------
const getTime = () => P.time === "auto" ? new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : P.time;
function drawStatus() {
  $("#clk").textContent = getTime();
  const bars = [0, 1, 2, 3].map(i => `<rect x="${i * 5}" y="${8 - i * 2.7}" width="3" height="${4 + i * 2.7}" rx="1" fill-opacity="${i < P.signal ? 1 : .3}"/>`).join("");
  const wifi = P.wifi === false ? "" : `<svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.5a10 10 0 0 1 14 0M4 7.3a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="#fff"/></svg>`;
  $("#sig").innerHTML =
    `<svg width="19" height="12" viewBox="0 0 19 12" fill="#fff">${bars}</svg>` + wifi +
    `<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="${Math.max(1, P.battery / 100 * 20)}" height="9" rx="2" fill="#fff"/><rect x="25" y="4" width="1.8" height="5" rx=".9" fill="#fff" fill-opacity=".5"/></svg>`;
}

function wall(kind) {
  const u = STORY.wallpaper && STORY.wallpaper[kind];
  return u ? `<div class="layer wall photo" style="background:#000 url('${u}') center/cover no-repeat"></div>` : `<div class="layer wall"></div>`;
}

// ---------- Layar kunci ----------
function showLock() {
  S.mode = "lock"; S.pin = "";
  const n = STORY.lockNotifs.map((n, i) => {
    const av = n.photo ? `<img src="${n.photo}" alt="">` : n.initial;
    return `<button class="notif" data-i="${i}"><span class="av">${av}<span class="mini" style="background:${ICONS[n.app]?.[0] || "#555"}"><svg viewBox="0 0 60 60">${ICONS[n.app]?.[1] || ""}</svg></span></span>
      <span class="t"><span class="row"><b>${n.name}</b><span>${n.time}</span></span><p>${n.text}</p></span></button>`;
  }).join("");
  screenEl.innerHTML = `${wall("lock")}
  <div class="layer lock" id="lock">
    <div class="date">${P.weekday}, ${P.month} ${P.day}</div>
    <div class="time">${getTime()}</div>
    ${P.lang ? `<div class="pill">🌐 ${P.lang}</div>` : ""}
    <div class="lnotifs">${n}</div>
    <div class="circ" style="left:40px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4l-1.500 2v10a2.500 2.500 0 0 1-3 0V9L9 7z"/></svg></div>
    <div class="circ" style="right:40px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.500"/></svg></div>
    <div class="swipe" id="swipe">Swipe up to open</div></div>`;
  const lock = $("#lock");
  let y0 = null;
  lock.onpointerdown = e => y0 = e.clientY;
  lock.onpointerup = e => { if (y0 !== null && y0 - e.clientY > 50) showPass(); y0 = null; };
  $("#swipe").onclick = () => showPass();
  lock.querySelectorAll(".notif").forEach(b => b.onclick = ev => { ev.stopPropagation(); S.pending = STORY.lockNotifs[b.dataset.i].app; showPass(); });
}

// ---------- Passcode ----------
const LETTERS = { 2: "ABC", 3: "DEF", 4: "GHI", 5: "JKL", 6: "MNO", 7: "PQRS", 8: "TUV", 9: "WXYZ" };
function showPass() {
  S.mode = "pass"; S.pin = "";
  const old = $("#passlayer"); if (old) old.remove();
  const el = document.createElement("div");
  el.className = "layer pass"; el.id = "passlayer";
  el.innerHTML = `<h2>Enter Passcode</h2><div class="hint">${P.hint || ""}</div>
    <div class="dots" id="dots">${[0,1,2,3].map(() => "<i></i>").join("")}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(k => `<button data-k="${k}" class="${k === 0 ? "z" : ""}">${k}<small>${LETTERS[k] || ""}</small></button>`).join("")}</div>
    <div class="pfoot"><button>Emergency</button><button id="cancel">Cancel</button></div>`;
  screenEl.append(el);
  el.querySelectorAll("[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
  $("#cancel").onclick = () => S.pin ? press("del") : showLock();
}
function press(k) {
  if (k === "del") S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += k;
  [...$("#dots").children].forEach((d, i) => d.classList.toggle("on", i < S.pin.length));
  $("#cancel").textContent = S.pin ? "Delete" : "Cancel";
  if (S.pin.length < 4) return;
  setTimeout(() => {
    if (S.pin === P.pin) { const p = S.pending; S.pending = null; showHome(); if (p) openApp(p); }
    else { S.pin = ""; const d = $("#dots"); [...d.children].forEach(x => x.classList.remove("on")); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake"); $("#cancel").textContent = "Cancel"; }
  }, 160);
}
document.addEventListener("keydown", e => {
  if (S.mode !== "pass") return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("del");
});

// ---------- Home screen ----------
function showHome() {
  S.mode = "home";
  const W = STORY.weather, b = STORY.badges;
  const app = id => `<button class="app" data-id="${id}">${b[id] ? `<span style="position:relative;display:block">` : ""}${icon(id).replace("</span>", b[id] ? `<span class="badge">${b[id]}</span></span>` : "</span>")}${b[id] ? "</span>" : ""}<em>${STORY.apps[id]}</em></button>`;
  screenEl.innerHTML = `${wall("home")}<div class="layer" id="home">
    <div class="widgets">
      <div class="wg cal"><b>${P.weekday}</b><span>${P.day}</span></div>
      <div class="wg wx"><div class="c">${W.city} ➚</div><div class="tp">${W.temp}°</div>
        <svg width="22" height="16" viewBox="0 0 22 16"><path d="M5 15a4.500 4.500 0 0 1 .5-9 6 6 0 0 1 11.500 1.500A3.800 3.800 0 0 1 17 15z" fill="#fff"/></svg>
        <div class="d">${W.desc}<small>H:${W.high}° L:${W.low}°</small></div></div>
    </div>
    <div class="grid">${STORY.home.map(app).join("")}</div>
    <div class="search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/></svg>Search</div>
    <div class="dock">${STORY.dock.map(app).join("")}</div></div>`;
  screenEl.querySelectorAll(".app").forEach(b => b.onclick = () => openApp(b.dataset.id));
}

// ---------- Membuka aplikasi ----------
// Isi aplikasi masih kosong. Nanti tiap aplikasi bisa punya tampilan sendiri lewat APP_SCREENS.
const APP_SCREENS = {};   // contoh nanti: APP_SCREENS.wa = el => { el.innerHTML = "..." }
function openApp(id) {
  S.mode = "app";
  const el = document.createElement("div");
  el.className = "layer appscreen"; el.id = "applayer";
  el.style.background = "linear-gradient(#17171c,#0c0c10)";
  if (APP_SCREENS[id]) APP_SCREENS[id](el);
  else el.innerHTML = `${icon(id)}<h1>${STORY.apps[id]}</h1><p>Isi aplikasi ini belum dibuat.<br>Tekan garis di bawah untuk kembali.</p>`;
  screenEl.append(el);
}

// Garis di bawah layar (home indicator)
$("#homebar").onclick = () => {
  if (S.mode === "lock") showPass();
  else if (S.mode === "app") { const a = $("#applayer"); if (a) a.remove(); S.mode = "home"; }
};

// ---------- Skala layar supaya muat di laptop ----------
function fit() {
  const p = $("#phone");
  if (innerWidth <= 480) return p.style.transform = "none";
  p.style.transform = `scale(${Math.min(1, (innerHeight - 40) / 852, (innerWidth - 40) / 393)})`;
}
addEventListener("resize", fit); fit();

drawStatus();
setInterval(drawStatus, 20000);
showLock();
</script>
</body>
</html>
