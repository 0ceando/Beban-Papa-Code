<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peeking Phone AU</title>
    <style>
        /* --- RESET & FONT --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- BINGKAI IPHONE --- */
        .iphone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 55px;
            position: relative;
            border: 8px solid #333;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Wallpaper Abstrak (Gelombang Biru/Ungu) */
        .wallpaper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #3b2e6b 0%, #284c8f 50%, #1b4173 100%);
            z-index: 0;
        }
        .wallpaper::before {
            content: '';
            position: absolute;
            top: 10%;
            left: -20%;
            width: 140%;
            height: 60%;
            background: radial-gradient(ellipse at center, #7157b5 0%, transparent 60%);
            transform: rotate(-15deg);
        }
        .wallpaper::after {
            content: '';
            position: absolute;
            bottom: -10%;
            right: -20%;
            width: 120%;
            height: 70%;
            background: radial-gradient(ellipse at center, #3b82f6 0%, transparent 65%);
            transform: rotate(20deg);
        }

        /* --- STATUS BAR & DYNAMIC ISLAND --- */
        .dynamic-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 100;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 28px;
            right: 28px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 15px;
            font-weight: 600;
            z-index: 100;
            pointer-events: none;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- LAYAR (UMUM) --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }

        /* --- 1. LOCK SCREEN --- */
        .lock-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }
        .date-text {
            color: white;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: -5px;
        }
        .clock-text {
            color: white;
            font-size: 92px;
            font-weight: 700;
            letter-spacing: -2px;
        }
        .lang-pill {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 10px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Notifikasi */
        .notification {
            position: absolute;
            bottom: 150px;
            width: 88%;
            background: rgba(35, 35, 40, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 22px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .notif-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            position: relative;
            background-image: url('https://i.pravatar.cc/100?img=11'); /* Foto profil random */
            background-size: cover;
        }
        .notif-badge {
            position: absolute;
            bottom: -2px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: #25D366;
            border-radius: 50%;
            border: 2px solid #232328;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .notif-content { flex: 1; color: white; }
        .notif-header {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .notif-time { color: #b3b3b3; font-weight: 400; font-size: 14px; }
        .notif-msg { font-size: 15px; color: #e5e5e5; }

        /* Tombol Bawah */
        .lock-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 15px;
            cursor: pointer;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 45px;
            margin-bottom: 25px;
        }
        .circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .swipe-text {
            color: white;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .home-bar {
            width: 135px;
            height: 5px;
            background: white;
            border-radius: 10px;
        }

        /* --- 2. PASSCODE SCREEN --- */
        .passcode-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            transform: translateY(100%);
            opacity: 0;
        }
        .lock-icon { margin-bottom: 15px; }
        .passcode-screen h2 {
            color: white;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .passcode-screen p {
            color: #e5e5e5;
            font-size: 14px;
            margin-top: 4px;
            margin-bottom: 20px;
        }
        .dots {
            display: flex;
            gap: 18px;
            margin-bottom: 40px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1.5px solid white;
            transition: background 0.2s;
        }
        .dot.active { background: white; }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            width: 82%;
        }
        .key {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 34px;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.1s;
        }
        .key:active { background: rgba(255, 255, 255, 0.4); }
        .key span {
            font-size: 10px;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: -2px;
        }
        .empty { visibility: hidden; }
        
        .passcode-bottom {
            position: absolute;
            bottom: 35px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            color: white;
            font-size: 16px;
            font-weight: 500;
        }
        .cancel-btn { cursor: pointer; }

        /* --- 3. HOME SCREEN --- */
        .home-screen {
            padding: 70px 25px 0;
            transform: translateY(100%);
            opacity: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* Widgets */
        .widgets {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .widget {
            border-radius: 22px;
            padding: 15px;
            flex: 1;
            height: 150px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .w-calendar {
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .w-calendar .day { color: #ff453a; font-size: 14px; font-weight: 600; }
        .w-calendar .date { font-size: 50px; font-weight: 400; letter-spacing: -2px; line-height: 1; margin-top: -5px; }
        .w-weather {
            background: linear-gradient(135deg, #5890c4, #2f5e9e);
            color: white;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .w-weather .city { font-size: 15px; font-weight: 500; }
        .w-weather .temp { font-size: 42px; font-weight: 400; line-height: 1; margin: 5px 0; }
        .w-weather .desc { font-size: 12px; font-weight: 500; }
        .w-weather .range { font-size: 11px; opacity: 0.8; margin-top: 2px;}

        /* Grid Aplikasi */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            row-gap: 20px;
            column-gap: 10px;
            flex: 1;
        }
        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            position: relative;
        }
        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        .app-name {
            color: white;
            font-size: 11px;
            font-weight: 400;
        }
        /* Badge Notif */
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3b30;
            color: white;
            font-size: 11px;
            font-weight: 600;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #1b4173; /* Sesuaikan dengan warna background */
        }

        /* Warna & Ikon Aplikasi */
        .i-mail { background: linear-gradient(180deg, #1e90ff, #0066cc); }
        .i-photos { background: #fff; } /* Bunga akan pakai SVG */
        .i-weather { background: linear-gradient(180deg, #4fa6f6, #1c75d1); }
        .i-calendar { background: #fff; color: black; flex-direction: column; }
        .i-calendar span:first-child { color: #ff3b30; font-size: 9px; font-weight: 600; margin-top: 8px;}
        .i-calendar span:last-child { font-size: 26px; font-weight: 300; line-height: 1; margin-top: 2px;}
        .i-notes { background: #fff; flex-direction: column; justify-content: flex-start; padding-top: 10px; gap: 4px;}
        .i-notes div { width: 40px; height: 3px; background: #d1d1d1; border-radius: 2px;}
        .i-maps { background: #e5e5ea; }
        .i-x { background: #000; }
        .i-settings { background: linear-gradient(180deg, #a0a0a5, #737378); }
        .i-camera { background: #d1d1d6; }
        .i-clock { background: #000; position: relative; border-radius: 50% !important; }
        .i-journal { background: #d4e9d4; border: 1px solid #b5d3b5;}
        .i-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }

        /* Search Pill */
        .search-pill {
            background: rgba(0, 0, 0, 0.4);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            align-self: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Dock */
        .dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        .dock .app-icon { width: 55px; height: 55px; }
        .i-phone { background: linear-gradient(180deg, #4cd964, #27cd48); }
        .i-safari { background: #fff; }
        .i-wa { background: #25D366; }
        .i-music { background: linear-gradient(180deg, #fc5c7d, #ff2a54); }


        /* --- ANIMASI SHAKE (KALAU PASSWORD SALAH) --- */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

    </style>
</head>

    <script>
        // --- LOGIKA JAM REALTIME ---
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('status-time').innerText = `${hours}:${minutes}`;
            document.getElementById('big-time').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- LOGIKA PINDAH LAYAR ---
        const lockScreen = document.getElementById('lock-screen');
        const passcodeScreen = document.getElementById('passcode-screen');
        const homeScreen = document.getElementById('home-screen');

        function goToPasscode() {
            lockScreen.style.transform = "translateY(-100%)";
            lockScreen.style.opacity = "0";
            
            passcodeScreen.style.transform = "translateY(0)";
            passcodeScreen.style.opacity = "1";
        }

        // --- LOGIKA PASSWORD ---
        let inputPasscode = "";
        const correctPasscode = "2003"; // Password disetting 2003 sayang!
        const dots = document.querySelectorAll('.dot');

        function pressKey(num) {
            if (inputPasscode.length < 4) {
                inputPasscode += num;
                updateDots();
            }

            if (inputPasscode.length === 4) {
                setTimeout(checkPasscode, 250);
            }
        }

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < inputPasscode.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function checkPasscode() {
            if (inputPasscode === correctPasscode) {
                // Jika benar, masuk Home Screen
                passcodeScreen.style.transform = "translateY(-100%)";
                passcodeScreen.style.opacity = "0";
                
                homeScreen.style.transform = "translateY(0)";
                homeScreen.style.opacity = "1";
            } else {
                // Jika salah, getarkan layar
                passcodeScreen.classList.add('shake');
                setTimeout(() => {
                    passcodeScreen.classList.remove('shake');
                    inputPasscode = "";
                    updateDots();
                }, 400);
            }
        }

        function cancelPasscode() {
            inputPasscode = "";
            updateDots();
        }
    </script>
